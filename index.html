<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<meta name="apple-mobile-web-app-title" content="Calculator">
<meta name="application-name" content="Calculator">
<meta name="theme-color" content="#1c1c1e">
<link rel="icon" id="ic" href="data:,">
<link rel="apple-touch-icon" id="aic" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#15131f;--bar:#1e1b2e;--in:#2a2640;--txt:#f4f1ff;--sub:#9a94b8;--s1:#7c5cff;--s2:#ff5fa2;--acc:#ffc247}
body.sunset{--bg:#2b1230;--bar:#3a1740;--in:#4a2150;--s1:#ff7a45;--s2:#ff3d7f}
body.light{--bg:#f3f0ff;--bar:#fff;--in:#fff;--txt:#1d1933;--sub:#7a7596;--s1:#6b4cff;--s2:#ff5fa2}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Outfit,system-ui,sans-serif;background:#0b0a12;color:var(--txt);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}body.light{background:#e4deff}body.sunset{background:#1b0a1f}
.v{display:none;flex-direction:column;height:var(--h,100dvh);width:100%;max-width:560px;margin:0 auto;background:var(--bg);position:relative}.v.on{display:flex}
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;background:var(--bar);box-shadow:0 2px 14px #0004;z-index:5}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--s1),var(--s2));display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;flex:none}
.who{flex:1;line-height:1.2;min-width:0}.who b{font-size:17px}.who small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;background:none;border:0;color:var(--txt);font-size:21px;width:40px;height:40px;border-radius:50%;cursor:pointer;flex:none}
.ib:active{background:#ffffff1f}
.bd{position:absolute;top:2px;right:2px;background:var(--s2);color:#fff;font-size:11px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center}
/* auth */
#auth{justify-content:center;padding:24px;gap:14px;background:radial-gradient(circle at 20% 0,color-mix(in srgb,var(--s1) 35%,transparent),transparent 55%),var(--bg)}#auth>*{width:100%;max-width:400px;margin-left:auto;margin-right:auto}
#auth h1{font-size:40px;text-align:center}#auth p{text-align:center;color:var(--sub);margin-top:-8px}
.tabs{display:flex;background:var(--in);border-radius:24px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--sub);padding:10px;border-radius:20px;font:500 16px Outfit,sans-serif;cursor:pointer}
.tabs button.sel{background:linear-gradient(135deg,var(--s1),var(--s2));color:#fff}
.f{background:var(--in);color:var(--txt);border:0;border-radius:14px;padding:14px 16px;font:16px Outfit,sans-serif;outline:0;width:100%}
.btn{border:0;border-radius:24px;padding:13px 22px;font:700 16px Outfit,sans-serif;cursor:pointer;background:linear-gradient(135deg,var(--s1),var(--s2));color:#fff}
.btn.g{background:var(--in);color:var(--txt)}.btn.r{background:#e5484d}
.err{color:#ff8a8a;text-align:center;min-height:20px;font-size:14px}
/* list */
#fl{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-bottom:1px solid #ffffff0d}
.row:active{background:#ffffff12}.row .tm{font-size:12px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 24px}
/* chat */
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.day{align-self:center;font-size:12px;color:var(--sub);background:var(--bar);padding:3px 12px;border-radius:12px;margin:6px 0}
.m{max-width:80%;padding:8px 12px 5px;border-radius:18px;font-size:16px;line-height:1.35;word-wrap:break-word;animation:pop .16s ease-out;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--s1),var(--s2));color:#fff;border-bottom-right-radius:5px}
.m.bot{align-self:flex-start;background:var(--in);border-bottom-left-radius:5px}
.m.gone{background:none!important;border:1px dashed #ffffff33;color:var(--sub);font-style:italic;font-size:14px}
.m .t{display:block;text-align:right;font-size:11px;opacity:.7;margin-top:2px}
.m.big{font-size:42px;background:none!important;padding:0 4px}
.m img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin:2px 0 4px;cursor:zoom-in}
.dl{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:16px;cursor:pointer}
.m.shake{animation:shake .5s}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.typing{align-self:flex-start;background:var(--in);padding:10px 14px;border-radius:18px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
#panel{display:none;background:var(--bar);padding:8px;max-height:210px;overflow-y:auto;grid-template-columns:repeat(8,1fr);gap:2px}
#panel.on{display:grid}#panel button{background:none;border:0;font-size:26px;padding:4px;border-radius:8px;cursor:pointer}
#fx{display:none;background:var(--bar);padding:8px 10px;gap:8px;overflow-x:auto}#fx.on{display:flex}
.chip{flex:none;border:1.5px solid #ffffff22;background:var(--in);color:var(--txt);padding:7px 14px;border-radius:20px;font:500 14px Outfit,sans-serif;cursor:pointer}
.chip.sel{border-color:var(--acc);background:var(--acc);color:#1d1933}
footer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar)}
#in{flex:1;background:var(--in);color:var(--txt);border:0;border-radius:22px;padding:11px 16px;font:16px Outfit,sans-serif;outline:0;resize:none;max-height:100px}
#send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--s1),var(--s2));color:#fff;font-size:20px;cursor:pointer;flex:none}
#panel{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))!important}
#cv{position:fixed;inset:0;pointer-events:none;z-index:50}
/* modal */
.md{position:fixed;inset:0;background:#000b;z-index:60;display:none;align-items:flex-end;justify-content:center}
.md.on{display:flex}.md.c{align-items:center;flex-direction:column;justify-content:center;gap:14px;padding:16px}
.sh{background:var(--bar);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:85%;overflow-y:auto}
.sh h3{font-size:18px}.sh .row{padding:8px 0;cursor:default}
.sm{padding:8px 16px;font-size:14px}
#vw img{max-width:100%;max-height:75%;border-radius:12px}
#toast{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:80;background:var(--bar);color:var(--txt);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px #000a;border:1px solid #ffffff22;transform:translateY(-140%);transition:transform .35s cubic-bezier(.3,1.4,.5,1);cursor:pointer;max-width:480px;margin:0 auto}
#toast.on{transform:none}#toast .who small{color:var(--txt);opacity:.85}
.ub{background:var(--s2);color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;margin-top:4px}
.rt{display:flex;flex-direction:column;align-items:flex-end}
#calc{background:#000;color:#fff;justify-content:flex-end;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));gap:12px;user-select:none;-webkit-user-select:none}
#calc .ex{text-align:right;color:#8e8e93;font-size:20px;min-height:26px;padding:0 8px;overflow:hidden;white-space:nowrap}
#calc .dp{text-align:right;font-size:84px;font-weight:300;line-height:1;padding:0 8px 8px;overflow:hidden;white-space:nowrap}
#calc .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:420px;width:100%;margin:0 auto}
#calc .kp button{aspect-ratio:1;border:0;border-radius:50%;background:#333;color:#fff;font:400 32px Outfit,sans-serif;cursor:pointer;transition:filter .1s}
#calc .kp button:active{filter:brightness(1.6)}
#calc .kp .l{background:#a5a5a5;color:#000}#calc .kp .o{background:#ff9f0a;font-size:38px}
#calc .kp .z{grid-column:span 2;aspect-ratio:auto;border-radius:40px;text-align:left;padding-left:8%}
#calc .ex,#calc .dp{max-width:420px;width:100%;margin:0 auto}
.m{max-width:min(80%,420px)}.m img{max-height:min(300px,42vh)}
.btn,.chip,.row,.ib{touch-action:manipulation}
@media (hover:hover){.row:hover{background:#ffffff0d}.ib:hover{background:#ffffff1a}.chip:hover{filter:brightness(1.15)}.btn:hover{filter:brightness(1.1)}#calc .kp button:hover{filter:brightness(1.25)}}
@media (min-width:700px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#2a1f55,#0b0a12 60%)}
  body.light{background:radial-gradient(circle at 30% 20%,#fff,#d8d0ff 70%)}
  .v{height:min(var(--h,100dvh) - 32px,860px);border-radius:26px;overflow:hidden;box-shadow:0 30px 80px #0009,0 0 0 1px #ffffff14;flex:none}
  .v.on{display:flex}
  .md{align-items:center!important}.sh{border-radius:22px!important;max-width:440px}
}
@media (max-width:360px){
  header{gap:4px;padding-left:6px;padding-right:6px}.ib{width:36px;height:36px;font-size:19px}.av{width:38px;height:38px}
  .who b{font-size:15px}#panel button{font-size:23px}.m{font-size:15px}#auth h1{font-size:32px}
}
@media (max-height:560px){
  #calc{padding-top:8px;gap:6px}#calc .kp{gap:7px}#calc .kp button{aspect-ratio:auto;height:11vh;font-size:22px}#calc .kp .o{font-size:26px}#calc .kp .z{border-radius:30px}
  #panel{max-height:30vh}header{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
  #auth{justify-content:flex-start;overflow-y:auto;padding:14px 24px}#auth h1{font-size:28px}
}
@media (max-height:560px) and (min-width:700px){.v{height:calc(var(--h,100dvh) - 8px)}}
#pic{overflow:hidden}#pic input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.up{position:relative;overflow:hidden;text-align:center;display:block}.up input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.fc{display:flex;align-items:center;gap:10px;background:#0003;border-radius:12px;padding:8px 10px;min-width:210px;margin:2px 0 4px}
.fc .fi{font-size:30px}.fc div{min-width:0;flex:1}.fc b{font-size:14px;word-break:break-all;display:block;font-weight:500}.fc small{opacity:.75;font-size:12px}
.fc button{border:0;background:#fff3;color:inherit;width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- CALCULATOR (cover) -->
<section class="v on" id="calc">
  <div class="ex" id="cex"></div>
  <div class="dp" id="cdp">0</div>
  <div class="kp" id="kp"></div>
</section>

<!-- LOGIN -->
<section class="v" id="auth">
  <h1>🧮 Calc</h1><p>Sign in</p>
  <div class="tabs"><button class="sel" id="tl">Login</button><button id="ts">Naya account</button></div>
  <input class="f" id="un" placeholder="Username (a-z, 0-9, _)" autocapitalize="none" autocomplete="username">
  <input class="f" id="pw" type="password" placeholder="Password (kam se kam 4)" autocomplete="current-password">
  <div class="err" id="er"></div>
  <button class="btn" id="go">Login</button>
</section>

<!-- FRIEND LIST -->
<section class="v" id="list">
  <header>
    <div class="av" id="meav"></div>
    <div class="who"><b id="mename"></b><small>Aapki chats</small></div>
    <button class="ib" id="addb" title="Dost">👥<span class="bd" id="bd" hidden></span></button>
    <button class="ib" id="setb" title="Settings">⚙️</button>
    <button class="ib" id="lockb" title="Lock">🔒</button>
  </header>
  <div id="fl"></div>
</section>

<!-- CHAT -->
<section class="v" id="chat">
  <header>
    <button class="ib" id="back">←</button>
    <div class="av" id="pav"></div>
    <div class="who"><b id="pname"></b><small id="psub">online</small></div>
    <button class="ib" id="fxb" title="Effects">✨</button>
    <button class="ib" id="clr" title="Chat delete">🗑️</button>
  </header>
  <div id="msgs"></div>
  <div id="fx">
    <button class="chip sel" data-fx="">Koi nahi</button>
    <button class="chip" data-fx="confetti">🎉 Confetti</button>
    <button class="chip" data-fx="hearts">❤️ Hearts</button>
    <button class="chip" data-fx="snow">❄️ Snow</button>
    <button class="chip" data-fx="stars">⭐ Stars</button>
    <button class="chip" data-fx="shake">📳 Shake</button>
  </div>
  <div id="panel"></div>
  <footer>
    <button class="ib" id="emb">😊</button>
    <button class="ib" id="pic" title="Photo / File">📎</button>
    <textarea id="in" rows="1" placeholder="Message likho..."></textarea>
    <button id="send" aria-label="Bhejo">➤</button>
  </footer>
</section>

<div id="toast"><div class="av" id="tav"></div><div class="who"><b id="tn"></b><small id="tm"></small></div></div>
<!-- MODALS -->
<div class="md" id="friends"><div class="sh">
  <h3>Dost add karo</h3>
  <input class="f" id="fq" placeholder="Dost ka username" autocapitalize="none">
  <button class="btn" id="fsend">Request bhejo</button>
  <div class="err" id="fer"></div>
  <h3>Requests</h3><div id="reqs"></div>
  <button class="btn g" data-close>Band karo</button>
</div></div>
<div class="md" id="att"><div class="sh">
  <h3>Kya bhejna hai?</h3>
  <label class="btn g up">🖼️ Gallery se photo<input type="file" id="file" accept="image/*"></label>
  <label class="btn g up">📸 Camera se photo<input type="file" id="cam" accept="image/*" capture="environment"></label>
  <label class="btn g up">📄 File upload (PDF, doc, zip...)<input type="file" id="docf"></label>
  <div class="err" style="min-height:0;color:var(--sub)">File ki limit: 1.5 MB tak</div>
  <button class="btn g" data-close>Cancel</button>
</div></div>
<div class="md" id="act"><div class="sh" id="actb"></div></div>
<div class="md c" id="vw">
  <img id="vimg" alt="">
  <div style="display:flex;gap:10px"><button class="btn" id="vdl">⬇ Download</button><button class="btn g" id="vx">Band karo</button></div>
</div>

<script>
const $=s=>document.querySelector(s);
const KEY='baatein_db2';
let db={users:{},msgs:{}};
try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}
const load=()=>{try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}};
const BC=new Map();
const getB=k=>{if(BC.has(k))return BC.get(k);let v=null;try{v=localStorage.getItem(k)}catch(e){}if(v)BC.set(k,v);return v};
const delB=id=>['b_','f_'].forEach(p=>{try{localStorage.removeItem(p+id)}catch(e){}BC.delete(p+id)});
function pruneOne(){
  const all=[];Object.values(db.msgs).forEach(t=>t.forEach(m=>{if(m.i||m.fl)all.push(m)}));
  if(!all.length)return false;
  const o=all.sort((a,b)=>a.t-b.t)[0];delB(o.id);o.i=undefined;o.fl=undefined;o.x=o.x||'📎 (purani photo/file hata di gayi)';return true;
}
function setB(k,v){
  for(let n=0;n<30;n++){try{localStorage.setItem(k,v);BC.set(k,v);return true}catch(e){if(!pruneOne())break}}
  alert('Phone ki storage full hai. Kuch purani chat delete karo.');return false;
}
const save=()=>{
  for(let n=0;n<40;n++){try{localStorage.setItem(KEY,JSON.stringify(db));return}catch(e){if(!pruneOne()){alert('Phone ki storage full hai. Kuch purani chat delete karo.');return}}}
};
/* purani photos/files ko alag jagah rakho taaki chat tez rahe */
(function(){let ch=0;Object.values(db.msgs).forEach(t=>t.forEach(m=>{
  if(typeof m.i==='string'){if(setB('b_'+m.id,m.i)){m.i=1;ch=1}}
  if(m.fl&&m.fl.d){if(setB('f_'+m.id,m.fl.d)){delete m.fl.d;ch=1}}
}));if(ch)save()})();
let me=null,peer=null,curFx='';
try{me=localStorage.getItem('baatein_me')}catch(e){}
const ck=(a,b)=>[a,b].sort().join('|');
const thread=(a,b)=>db.msgs[ck(a,b)]||(db.msgs[ck(a,b)]=[]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dayOf=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?'Aaj':d.toLocaleDateString()};
const emojiOnly=s=>s&&/^(\p{Extended_Pictographic}|\s){1,6}$/u.test(s);
const show=id=>{document.querySelectorAll('.v').forEach(v=>v.classList.toggle('on',v.id===id))};
const ini=n=>n==='mor'?'🦚':n[0].toUpperCase();
const nm=n=>n==='mor'?'Mor — Dost Bot':n;

/* ---------- password hash ---------- */
async function hash(p){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('baatein:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of 'baatein:'+p)h=(h*33)^c.charCodeAt(0);return 'x'+(h>>>0).toString(16)}
}

/* ---------- auth ---------- */
let mode='login';
const setMode=m=>{mode=m;$('#tl').classList.toggle('sel',m==='login');$('#ts').classList.toggle('sel',m==='signup');$('#go').textContent=m==='login'?'Login':'Account banao';$('#er').textContent=''};
$('#tl').onclick=()=>setMode('login');$('#ts').onclick=()=>setMode('signup');
$('#go').onclick=async()=>{
  const u=$('#un').value.trim().toLowerCase(),p=$('#pw').value,er=$('#er');
  if(!/^[a-z0-9_]{3,15}$/.test(u))return er.textContent='Username 3-15 akshar ka ho: a-z, 0-9, _';
  if(p.length<4)return er.textContent='Password kam se kam 4 akshar ka rakho';
  load();const h=await hash(p);
  if(mode==='signup'){
    if(db.users[u]||u==='mor')return er.textContent='Ye username le liya gaya hai';
    db.users[u]={pw:h,friends:[],reqs:[],sent:[]};save();
  }else{
    if(!db.users[u]||db.users[u].pw!==h)return er.textContent='Username ya password galat hai';
  }
  me=u;try{localStorage.setItem('baatein_me',u)}catch(e){}
  $('#pw').value='';enter();
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
function enter(){
  const U=db.users[me];
  if(!thread(me,'mor').length){thread(me,'mor').push({id:uid(),f:'mor',x:'Namaste! 👋 Main Mor hoon. Dost add karo ya mujhse baat karo.',t:Date.now(),h:[]});save()}
  notifT=Date.now();$('#meav').textContent=ini(me);$('#mename').textContent=me;renderList();show('list');setTimeout(askNotif,600);
}


/* ---------- list ---------- */
const lastOf=p=>thread(me,p).filter(m=>!m.h.includes(me)).slice(-1)[0];
function renderList(){
  const U=db.users[me];if(!U)return;
  const fl=$('#fl');fl.innerHTML='';
  const names=['mor',...U.friends].sort((a,b)=>((lastOf(b)||{}).t||0)-((lastOf(a)||{}).t||0));
  names.forEach(n=>{
    const l=lastOf(n),r=document.createElement('div');r.className='row';
    r.innerHTML='<div class="av"></div><div class="who"><b></b><small></small></div><div class="rt"><span class="tm"></span></div>';
    const un=unread(n);if(un){const u=document.createElement('span');u.className='ub';u.textContent=un;r.querySelector('.rt').append(u);r.querySelector('b').style.color='var(--acc)'}
    r.querySelector('.av').textContent=ini(n);r.querySelector('b').textContent=nm(n);
    r.querySelector('small').textContent=!l?'Naya dost — hello bolo!':l.d?'🚫 Message delete hua':(l.f===me?'Aap: ':'')+(l.i?'📷 Photo':l.fl?'📄 '+l.fl.n:l.x);
    r.querySelector('.tm').textContent=l?fmt(l.t):'';
    r.onclick=()=>openChat(n);fl.append(r);
  });

function burst(type){
  const W=cv.width,H=cv.height,n=type==='confetti'?110:50;
  for(let i=0;i<n;i++){
    const p={type,x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3.5,r:6+Math.random()*10,rot:Math.random()*6,vr:(Math.random()-.5)*.2,life:1,col:`hsl(${Math.random()*360},90%,60%)`};
    if(type==='confetti'){p.x=W/2;p.y=H*.8;p.vx=(Math.random()-.5)*14;p.vy=-8-Math.random()*12;p.g=.35}
    if(type==='snow')p.r=3+Math.random()*5;
    if(type==='hearts'){p.y=H+20;p.vy=-2-Math.random()*3;p.vx=(Math.random()-.5)*1.2;p.r=14+Math.random()*16}
    if(type==='stars'){p.x=Math.random()*W;p.y=Math.random()*H;p.vy=0;p.vx=0;p.life=.5+Math.random()*.5;p.r=6+Math.random()*14}
    P.push(p)}
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){
  g.clearRect(0,0,cv.width,cv.height);
  P=P.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.g)p.vy+=p.g;
    if(p.type==='stars'){p.life-=.012;if(p.life<=0)return false}
    else if(p.y>cv.height+30||p.y<-60)return false;
    g.save();g.globalAlpha=Math.max(0,Math.min(1,p.life));g.translate(p.x,p.y);g.rotate(p.rot);
    if(p.type==='confetti'){g.fillStyle=p.col;g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2)}
    else if(p.type==='snow'){g.fillStyle='#fff';g.beginPath();g.arc(0,0,p.r,0,7);g.fill()}
    else{g.font=p.r*1.6+'px serif';g.textAlign='center';g.fillText(p.type==='hearts'?'❤️':'⭐',0,0)}
    g.restore();return true});
  if(P.length)requestAnimationFrame(tick);else{run=false;g.clearRect(0,0,cv.width,cv.height)}
}

    if(done){cur='0';ex='';done=false}
    if(fresh){cur='0';fresh=false}
    if(!cur.includes('.'))cur+='.';
  }else if('+-*/'.includes(k)){
    if(fresh&&ex){ex=ex.slice(0,-1)+k}else{ex+=(cur[0]==='-'?'('+cur+')':cur)+k;fresh=true}
    done=false;
  }else if(k==='AC'){ex='';cur='0';fresh=false;done=false}
  else if(k==='±'){if(cur!=='0')cur=cur[0]==='-'?cur.slice(1):'-'+cur}
  else if(k==='%'){cur=String(+(parseFloat(cur)/100).toPrecision(10))}
  else if(k==='='){
    if(!ex&&cur===PIN){unlock();return}
    if(!ex){return}
    const full=fresh?ex.slice(0,-1):ex+(cur[0]==='-'?'('+cur+')':cur);
    try{
      if(!/^[-0-9+*\/.()]+$/.test(full))throw 0;
      let r=Function('"use strict";return ('+full.replace(/(^|[+*\/-])-?/g,m=>m)+')')();
      if(!isFinite(r))throw 0;
      cur=String(+r.toPrecision(10));if(cur.includes('e'))cur=r.toExponential(4);
    }catch(e){cur='Error'}
    ex='';fresh=false;done=true;
  }
  showCalc();
}
function unlock(){ex='';cur='0';fresh=false;done=false;showCalc();if(me&&db.users[me]){load();enter()}else show('auth')}
function lock(){peer=null;$('#act').classList.remove('on');$('#friends').classList.remove('on');$('#vw').classList.remove('on');ex='';cur='0';showCalc();show('calc')}
$('#lockb').onclick=lock;
$('#setb').onclick=()=>sheet('Settings',[
  ['🎨 Theme badlo',()=>{ti=(ti+1)%3;setT()}],
  ['🔑 Secret PIN badlo',()=>{const n=prompt('Naya PIN (4 se 8 ank)');if(n===null)return;if(!/^\d{4,8}$/.test(n))return alert('PIN sirf 4 se 8 ank ka ho');PIN=n;try{localStorage.setItem('baatein_pin2',n)}catch(e){};alert('PIN badal gaya ✔')}],
  ['🚪 Logout',()=>{me=peer=null;try{localStorage.removeItem('baatein_me')}catch(e){};lock()}]
]);
/* auto-lock when app goes to background */
document.addEventListener('visibilitychange',()=>{if(document.hidden&&me&&!picking&&!$('#calc').classList.contains('on'))lock()});
$('#pic').addEventListener('click',()=>{picking=true;$('#att').classList.add('on');setTimeout(()=>picking=false,90000)});
['#file','#cam','#docf'].forEach(q=>$(q).addEventListener('change',()=>{setTimeout(()=>picking=false,1500)}));
['#file','#cam','#docf'].forEach(q=>$(q).addEventListener('cancel',()=>{picking=false}));
/* real viewport height (keyboard / browser bars) */
function setH(){const h=window.visualViewport?visualViewport.height:innerHeight;document.documentElement.style.setProperty('--h',h+'px');window.scrollTo(0,0);if(peer)msgs.scrollTop=msgs.scrollHeight}
if(window.visualViewport){visualViewport.addEventListener('resize',setH);visualViewport.addEventListener('scroll',()=>window.scrollTo(0,0))}
addEventListener('resize',()=>{setH();showCalc()});addEventListener('orientationchange',()=>setTimeout(()=>{setH();showCalc()},250));
setH();showCalc();show('calc');
</script>
